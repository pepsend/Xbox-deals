name: Actualizar precios Xbox

on:
  schedule:
    - cron: '0 */4 * * *'      # cada 4 horas: pesca juegos nuevos y refresca precios
  workflow_dispatch:          # boton para correrlo a mano

permissions:
  contents: write             # para commitear los datos

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar datos
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node robot.mjs

      - name: Commit de los datos
        run: |
          git config user.name  "xbox-deals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data/*.json
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Datos: $(date -u +%Y-%m-%d)"
            # Sincroniza con el repo antes de guardar (evita choques si algo cambio mientras corria)
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "reintento $i..."; sleep 5
            done
          fi
