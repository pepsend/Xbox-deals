<style>
  :root{
    --bg:#0c0e13;--bg2:#0f121a;--surface:#161a23;--surface-2:#1d2230;--raise:#222838;
    --border:#262c3a;--border-2:#2f3646;
    --text:#eef1f7;--muted:#98a1b4;--faint:#6b7488;
    --accent:#2fd35b;--accent-2:#25b04c;--accent-ink:#04240f;
    --good:#33d17a;--ok:#a3d84a;--mid:#f0b429;--low:#f97b4f;
    --save:#2fd35b;--save-ink:#04240f;
    --shadow:0 1px 0 rgba(255,255,255,.02) inset,0 6px 24px rgba(0,0,0,.35);
    --gap:16px;
  }
  html{color-scheme:dark}
  :root[data-theme="light"]{
    --bg:#e9edf2;--bg2:#dfe4ec;--surface:#ffffff;--surface-2:#eef2f6;--raise:#f4f7fa;
    --border:#cbd4e1;--border-2:#94a3b8;
    --text:#1e293b;--muted:#475569;--faint:#64748b;
    --accent:#107c41;--accent-2:#0d6937;--accent-ink:#ffffff;
    --good:#107c41;--ok:#4d7c0f;--mid:#b45309;--low:#c2410c;
    --save:#107c41;--save-ink:#ffffff;
    --shadow:0 1px 3px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.05);
  }
  html[data-theme="light"]{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  a{color:inherit}
  header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .head{display:flex;align-items:center;gap:14px;padding:18px 0 14px}
  .brand h1{margin:0;font-family:'Sora','Inter',system-ui,sans-serif;font-weight:800;font-size:19px;letter-spacing:-.4px}
  .brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
  .stat{margin-left:auto;text-align:right;font-size:12px;color:var(--faint);line-height:1.4}
  .stat b{color:var(--muted);font-weight:600}
  .headbtns{display:flex;gap:8px;align-items:center;margin-left:14px}
  .themebtn,.notifbtn{width:38px;height:38px;flex:none;border-radius:11px;border:1px solid var(--border);
    background:var(--surface);color:var(--muted);cursor:pointer;display:grid;place-items:center}
  .themebtn:hover,.notifbtn:hover{color:var(--text);border-color:var(--border-2)}
  .themebtn svg,.notifbtn svg{width:18px;height:18px}
  .notifbtn.active{border-color:var(--accent);color:var(--accent)}
  .tabs{display:flex;gap:2px;padding:2px 0 0}
  .tab{position:relative;background:none;border:none;color:var(--muted);font-family:'Sora','Inter',system-ui,sans-serif;
    font-weight:600;font-size:14px;padding:10px 14px;cursor:pointer;border-radius:9px 9px 0 0}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text)}
  .tab.active::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2.5px;
    background:var(--accent);border-radius:2px}
  .tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--low);margin-right:7px;vertical-align:1px}
  .tab .wl-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;
    padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;
    font-weight:700;margin-left:6px;vertical-align:-1px}
  .alert-banner{display:none;background:color-mix(in srgb,var(--accent) 12%,var(--surface));
    border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
    padding:10px 20px;font-size:13.5px;color:var(--text);align-items:center;gap:10px}
  .alert-banner.show{display:flex}
  .alert-banner strong{color:var(--accent);font-weight:700}
  .alert-close{margin-left:auto;border:none;background:none;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:0}
  .controls{display:flex;flex-wrap:wrap;gap:10px;padding:16px 0}
  .field{position:relative;display:flex}
  .field input,.field select{appearance:none;background:var(--surface);border:1px solid var(--border);
    color:var(--text);padding:10px 13px;border-radius:11px;font:inherit;font-size:14px;outline:none}
  .field input{min-width:230px}
  .field input::placeholder{color:var(--faint)}
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .field select{padding-right:32px;cursor:pointer;font-weight:500}
  .field.sel::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;
    border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
  .toggle{display:inline-flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);
    padding:10px 13px;border-radius:11px;font-size:13.5px;color:var(--muted);cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--accent);width:15px;height:15px}
  .count{margin-left:auto;align-self:center;color:var(--faint);font-size:13px;font-variant-numeric:tabular-nums}
  .grid{display:flex;flex-direction:column;gap:9px;padding:2px 0 30px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:15px;box-shadow:var(--shadow);
    padding:13px 16px;display:grid;grid-template-columns:76px 1fr minmax(238px,auto);gap:16px;align-items:center;
    transition:border-color .15s}
  .card:hover{border-color:var(--border-2)}
  .card.starred{border-color:color-mix(in srgb,var(--accent) 35%,var(--border))}
  .cover{width:76px;height:76px;border-radius:9px;object-fit:cover;background:var(--surface-2);
    box-shadow:0 4px 14px -4px rgba(0,0,0,.5)}
  .cover.ph{display:grid;place-items:center;color:var(--faint)}
  .info{min-width:0}
  .gtitle{font-family:'Sora','Inter',system-ui,sans-serif;font-weight:600;font-size:16px;line-height:1.25;margin:0 0 5px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .gmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .score{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:34px;padding:0 7px;
    border-radius:8px;font-family:'Sora','Inter',system-ui,sans-serif;font-weight:800;font-size:16px;color:#08110a}
  .score.na{background:var(--surface-2)!important;color:var(--faint);font-size:12px;font-weight:600}
  .slabel{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
  .year{color:var(--muted);font-size:12.5px}
  .preorder-badge{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--mid) 16%,transparent);
    color:var(--mid);border:1px solid color-mix(in srgb,var(--mid) 38%,transparent);
    font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap;letter-spacing:.2px;font-family:'Sora','Inter',system-ui,sans-serif}
  .preorder-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--mid);display:inline-block}
  .genre-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  .gtag{font-size:11px;color:var(--faint);background:var(--surface-2);border:1px solid var(--border);
    padding:1px 7px;border-radius:5px;font-weight:500}
  .pbox{display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:4px}
  .chile{color:var(--faint);font-size:11.5px}
  .chile b{color:var(--muted);font-weight:600}
  .bestrow{display:flex;align-items:center;gap:9px;justify-content:flex-end;flex-wrap:wrap}
  .flag{width:22px;height:15px;border-radius:3px;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
  .bregion{font-size:12.5px;color:var(--muted);font-weight:500}
  .bprice{font-family:'Sora','Inter',system-ui,sans-serif;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
  .tag{background:var(--save);color:var(--save-ink);font-family:'Sora','Inter',system-ui,sans-serif;font-weight:700;font-size:12px;
    padding:2px 8px;border-radius:7px;white-space:nowrap}
  .sub2{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
  .ends{display:inline-flex;align-items:center;gap:5px;color:var(--low);font-size:11.5px;font-weight:600}
  .ends svg{width:12px;height:12px}
  .na2{color:var(--faint);font-size:13px}
  .actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 2px}
  .expand{border:none;background:none;color:var(--accent);font-weight:600;font-size:12.5px;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:5px}
  .expand svg{width:12px;height:12px;transition:transform .2s}
  .expand.open svg{transform:rotate(180deg)}
  .act-group{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .act-btn{border:1px solid var(--border);background:var(--surface-2);color:var(--muted);
    font-weight:600;font-size:12px;cursor:pointer;padding:6px 11px;border-radius:9px;
    display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,color .15s,background .15s}
  .act-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--raise)}
  .act-btn:disabled{opacity:.45;cursor:default}
  .act-btn svg{width:13px;height:13px;flex:none}
  .act-btn.star-on{border-color:color-mix(in srgb,var(--accent) 50%,var(--border));color:var(--accent)}
  .act-btn.star-on svg{fill:var(--accent)}
  .regions{grid-column:1/-1;display:none;flex-direction:column;margin-top:4px;border:1px solid var(--border);
    border-radius:11px;overflow:hidden}
  .regions.open{display:flex}
  .rrow{display:flex;align-items:center;gap:11px;padding:9px 12px;font-size:13px}
  .rrow:nth-child(odd){background:var(--surface-2)}
  .rrow .rname{flex:1;min-width:0;font-weight:500}
  .rrow .rend{color:var(--low);font-size:11px}
  .rrow .rlocal{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
  .rrow .rdisc{color:var(--save);font-weight:700;font-size:11.5px}
  .rrow .rclp{font-family:'Sora','Inter',system-ui,sans-serif;font-weight:700;font-variant-numeric:tabular-nums;min-width:92px;text-align:right}
  .rrow a{color:var(--accent);text-decoration:none;font-size:12px;font-weight:600;white-space:nowrap}
  .rrow a:hover{text-decoration:underline}
  .state{padding:80px 16px;text-align:center;color:var(--muted)}
  .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;padding:10px 0 46px}
  .pbtn{min-width:38px;height:38px;padding:0 11px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
    color:var(--text);font-family:'Sora','Inter',system-ui,sans-serif;font-weight:600;font-size:14px;cursor:pointer}
  .pbtn:hover:not(:disabled):not(.active){border-color:var(--accent);color:var(--accent)}
  .pbtn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .pbtn:disabled{opacity:.4;cursor:default}
  .pgap{color:var(--faint);padding:0 3px}
  .pinfo{width:100%;text-align:center;color:var(--faint);font-size:12px;margin-top:6px}
  footer{border-top:1px solid var(--border);color:var(--faint);font-size:12px;line-height:1.7;padding:22px 0 46px}
  footer b{color:var(--muted)}

  /* Modal comparador */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-overlay.open{display:flex}
  .modal{background:var(--bg2);border:1px solid var(--border-2);border-radius:18px;
    max-width:720px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .modal-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border);flex:none}
  .modal-cover{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none}
  .modal-title{font-family:'Sora','Inter',system-ui,sans-serif;font-weight:700;font-size:16px;margin:0;min-width:0}
  .modal-close{margin-left:auto;border:none;background:none;color:var(--muted);cursor:pointer;font-size:22px;line-height:1;padding:0 4px;flex:none}
  .modal-close:hover{color:var(--text)}
  .modal-body{overflow-y:auto;padding:0 0 12px}
  .cmp-table{width:100%;border-collapse:collapse}
  .cmp-table th{padding:10px 14px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--faint);font-weight:600;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:1}
  .cmp-table td{padding:10px 14px;font-size:13.5px;border-bottom:1px solid var(--border)}
  .cmp-table tr:last-child td{border-bottom:none}
  .cmp-table tr.best-row td{background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .best-badge{background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;
    padding:1px 6px;border-radius:5px;margin-left:6px;white-space:nowrap;vertical-align:1px}
  .sort-btn{background:none;border:none;color:inherit;cursor:pointer;padding:0;font:inherit;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
  .cmp-link{color:var(--accent);text-decoration:none;font-size:12px;font-weight:600}
  .cmp-link:hover{text-decoration:underline}
  .cmp-access{font-size:11px;color:var(--faint)}

  /* Vista detalle */
  #detail-view{display:none}
  #detail-view.show{display:block}
  #main-view.hide{display:none}
  .detail-back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:14px;
    font-weight:600;cursor:pointer;border:none;background:none;padding:18px 0 14px}
  .detail-back:hover{color:var(--text)}
  .detail-back svg{width:16px;height:16px}
  .detail-hero{display:grid;grid-template-columns:160px 1fr;gap:24px;align-items:start;
    padding:20px 0 24px;border-bottom:1px solid var(--border)}
  .detail-cover{width:160px;height:160px;border-radius:14px;object-fit:cover;
    box-shadow:0 8px 32px -8px rgba(0,0,0,.7)}
  .detail-cover-ph{width:160px;height:160px;border-radius:14px;background:var(--surface-2);
    display:grid;place-items:center;color:var(--faint);font-size:40px}
  .detail-title{font-family:'Sora','Inter',system-ui,sans-serif;font-weight:800;font-size:26px;
    line-height:1.2;margin:0 0 8px}
  .detail-score-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .detail-genre-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .detail-gtag{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);
    padding:2px 9px;border-radius:6px;font-weight:500}
  .detail-best{font-size:14px;color:var(--muted);margin-bottom:12px}
  .detail-best b{color:var(--text)}
  .detail-best .bprice{color:var(--accent);font-size:20px;font-family:'Sora','Inter',system-ui,sans-serif;font-weight:800}
  .detail-section{padding:24px 0;border-bottom:1px solid var(--border)}
  .detail-section:last-child{border-bottom:none;padding-bottom:48px}
  .detail-section-title{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:700;margin:0 0 16px}
  .chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;overflow:hidden}
  .chart-controls{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .chart-rgsel{appearance:none;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);padding:5px 28px 5px 10px;border-radius:8px;font:inherit;font-size:13px;outline:none;cursor:pointer}
  .chart-period{display:flex;gap:4px}
  .cper{border:1px solid var(--border);background:none;color:var(--muted);font-size:12px;
    padding:4px 10px;border-radius:7px;cursor:pointer;font-weight:600}
  .cper.active{background:var(--surface-2);color:var(--text);border-color:var(--border-2)}
  .chart-empty{padding:40px 0;text-align:center;color:var(--faint);font-size:13px}
  svg.price-chart{width:100%;display:block;overflow:visible}

  @media(max-width:600px){
    .wrap{padding:0 12px}

    /* Cabecera móvil compacta */
    .head{padding:12px 0 8px;gap:10px}
    .brand h1{font-size:16.5px;letter-spacing:-.3px}
    .brand p{display:none}
    .stat{display:none}
    .headbtns{margin-left:auto;gap:6px}
    .themebtn,.notifbtn{width:35px;height:35px;border-radius:9px}
    .themebtn svg,.notifbtn svg{width:16px;height:16px}

    /* Tabs horizontales deslizables */
    .tabs{overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .tab{padding:8px 12px;font-size:13px;white-space:nowrap}

    /* Controles y filtros organizados en cuadrícula */
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 0 10px}
    .controls .field:first-child{grid-column:1 / -1}
    .controls .field input{min-width:0;width:100%;padding:9px 12px;font-size:13.5px}
    .controls .field select{width:100%;padding:9px 26px 9px 10px;font-size:13px}
    .toggle{grid-column:1 / 2;padding:8px 10px;font-size:12px;white-space:nowrap}
    .count{grid-column:2 / 3;justify-self:end;align-self:center;font-size:12px}

    /* Tarjeta de juego móvil */
    .card{grid-template-columns:68px 1fr;gap:12px;padding:12px;border-radius:14px}
    .cover{width:68px;height:68px;border-radius:8px}
    .gtitle{font-size:15px;line-height:1.25;margin:0 0 4px}
    .gmeta{gap:6px}
    .score{min-width:30px;height:26px;font-size:13.5px;padding:0 4px;border-radius:6px}
    .slabel{display:none}
    .genre-tags{margin-top:4px}
    .gtag{font-size:10.5px;padding:1px 6px}

    /* Caja de precio destacada */
    .pbox{
      grid-column:1 / -1;
      width:100%;
      background:var(--surface-2);
      border:1px solid var(--border);
      border-radius:10px;
      padding:10px 12px;
      display:flex;
      flex-direction:column;
      align-items:stretch;
      text-align:left;
      gap:4px;
    }
    .pbox .bestrow{
      justify-content:space-between;
      width:100%;
      gap:6px;
      order:1;
    }
    .pbox .bestrow .bprice{font-size:18px}
    .pbox .sub2{
      font-size:11.5px;
      order:2;
      display:flex;
      justify-content:space-between;
    }
    .pbox .chile{
      font-size:11px;
      order:3;
      border-top:1px dashed var(--border);
      padding-top:4px;
      margin-top:2px;
      display:flex;
      justify-content:space-between;
    }
    .pbox .ends{
      order:4;
      font-size:11px;
    }

    /* Acciones móviles limpias */
    .actions{
      grid-column:1 / -1;
      display:flex;
      flex-direction:column;
      gap:8px;
      align-items:stretch;
      padding-top:2px;
    }
    .expand{
      width:100%;
      justify-content:center;
      padding:8px 0;
      font-size:12.5px;
      border-radius:8px;
      background:color-mix(in srgb,var(--accent) 8%,transparent);
    }
    .act-group{
      margin-left:0;
      width:100%;
      display:flex;
      gap:6px;
    }
    .act-btn{
      flex:1;
      min-width:0;
      padding:8px 6px;
      font-size:11.5px;
      justify-content:center;
      text-align:center;
      border-radius:8px;
      white-space:nowrap;
    }
    .act-btn.star-btn{
      flex:0 0 38px;
      padding:8px 0;
    }
    .act-btn.star-btn span{display:none}

    /* Filas de regiones optimizadas para móvil */
    .rrow{
      display:grid;
      grid-template-columns:auto 1fr auto;
      grid-template-areas:
        "flag name clp"
        "space local link";
      gap:2px 8px;
      padding:8px 10px;
      font-size:12.5px;
    }
    .rrow .flag{grid-area:flag;margin-top:2px}
    .rrow .rname{grid-area:name;display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-weight:600}
    .rrow .rclp{grid-area:clp;text-align:right;font-weight:700}
    .rrow .rlocal{grid-area:local;font-size:11px;color:var(--muted)}
    .rrow .cmp-access{display:none}
    .rrow a{grid-area:link;text-align:right;font-size:11.5px}

    /* Vista detalle móvil */
    .detail-hero{grid-template-columns:90px 1fr;gap:12px;padding:14px 0 18px}
    .detail-cover,.detail-cover-ph{width:90px;height:90px;border-radius:10px}
    .detail-title{font-size:18px}
    .detail-section{padding:18px 0}

    /* Modal comparador estilo Bottom Sheet */
    .modal-overlay{align-items:flex-end;padding:0}
    .modal{
      border-radius:20px 20px 0 0;
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      max-height:85vh;
      max-width:100%;
      border-bottom:none;
    }
    .modal-head{padding:14px 16px}
    .modal-body{padding:0 0 20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .cmp-table{min-width:480px}
  }
</style>
</head>
<body>

<div class="alert-banner" id="alert-banner">
  <span>📉 <strong id="alert-text"></strong></span>
  <button class="alert-close" onclick="document.getElementById('alert-banner').classList.remove('show')" aria-label="Cerrar">×</button>
</div>

<header>
  <div class="wrap">
    <div class="head">
      <div class="brand">
        <h1>Comparador de precios Xbox</h1>
        <p>Todo el catálogo, por región. Encuentra donde está más barato.</p>
      </div>
      <div class="stat" id="stat"></div>
      <div class="headbtns">
        <button class="notifbtn" id="notifbtn" title="Activar alertas de precio" aria-label="Alertas de precio"></button>
        <button class="themebtn" id="themebtn" title="Cambiar tema" aria-label="Cambiar tema"></button>
      </div>
    </div>
    <div class="tabs" id="tabs" hidden>
      <button class="tab active" data-mode="all">Todos los juegos</button>
      <button class="tab" data-mode="ofertas"><span class="dot"></span>Ofertas</button>
      <button class="tab" data-mode="watchlist">⭐ Watchlist<span class="wl-badge" id="wl-badge" style="display:none">0</span></button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="controls" id="controls" hidden>
    <div class="field"><input id="q" type="search" placeholder="Buscar juego..." autocomplete="off"></div>
    <div class="field sel"><select id="sort">
      <option value="new" selected>Recién lanzados</option>
      <option value="mc">Nota (mayor a menor)</option>
      <option value="clp">Precio más barato</option>
      <option value="save">Mayor ahorro vs Chile</option>
      <option value="disc">Mayor descuento</option>
      <option value="name">Nombre (A-Z)</option>
    </select></div>
    <div class="field sel"><select id="genre"><option value="">Todos los géneros</option></select></div>
    <label class="toggle"><input type="checkbox" id="rated"> Solo con nota</label>
    <span class="count" id="count"></span>
  </div>
</div>

<div id="main-view">
  <main class="wrap">
    <div id="state" class="state"><div class="spinner"></div><div>Cargando catálogo...</div></div>
    <div class="grid" id="grid"></div>
    <div class="pager" id="pager"></div>
  </main>
</div>

<div id="detail-view" class="wrap">
  <button class="detail-back" id="detail-back"></button>
  <div id="detail-content"></div>
</div>

<footer class="wrap"><div id="foot"></div></footer>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-head">
      <img class="modal-cover" id="modal-cover" src="" alt="" style="display:none">
      <h2 class="modal-title" id="modal-title"></h2>
      <button class="modal-close" id="modal-close" aria-label="Cerrar">×</button>
    </div>
    <div class="modal-body">
      <table class="cmp-table">
        <thead><tr>
          <th>Región</th>
          <th>Acceso</th>
          <th>Local</th>
          <th><button class="sort-btn" id="cmp-sort-clp">CLP ↑</button></th>
          <th>Desc.</th>
          <th>Fin</th>
          <th></th>
        </tr></thead>
        <tbody id="cmp-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
// ============= Estado global =============
let GAMES=[], META=null, REGIONS=[], REG={}, ROWS=[], HISTORY={};
let page=1, PER=40, mode='all';
let WATCHLIST=new Set(), PRICE_SNAP={};
let cmpGame=null, cmpAsc=true;
let chartPeriod=90, chartRegion='';

const $=s=>document.querySelector(s);
const fmtCLP=n=>n==null?'-':'$'+Math.round(n).toLocaleString('es-CL');
const fmtLocal=(n,c)=>n==null?'-':Number(n).toLocaleString('es-CL',{maximumFractionDigits:2})+' '+c;
const scoreColor=mc=>mc>=90?'var(--good)':mc>=80?'var(--ok)':mc>=70?'var(--mid)':'var(--low)';
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fmtDate=s=>{if(!s)return null;const p=s.split('-');return (+p[2])+' '+MESES[(+p[1])-1]+' '+p[0];};
const TODAY_STR=new Date().toISOString().slice(0,10);
const isPreorder=g=>Boolean(g.d && g.d > TODAY_STR);
const fmtRelDate=d=>{if(!d)return '';const p=d.split('-');return (+p[2])+' '+MESES[(+p[1])-1]+' '+p[0];};
const flagImg=c=>`<img class="flag" src="https://flagcdn.com/w40/${c.toLowerCase()}.png" alt="${c}" loading="lazy">`;
const CLOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 1.8"/></svg>';
const CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';
const DLOAD='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 11l5 5 5-5"/><path d="M5 21h14"/></svg>';
const BACK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>';
const STAR_ICO='<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
const COMPARE_ICO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 3v4M6 17v4M3 7h18M3 17h18"/></svg>';
const DETAIL_ICO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
const BELL_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>';
const BELL_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13.73 21a2 2 0 0 1-3.46 0"/><path d="M18.63 13A17.89 17.89 0 0 1 18 8"/><path d="M6.26 6.26A5.86 5.86 0 0 0 6 8c0 7-3 9-3 9h14"/><path d="M18 8a6 6 0 0 0-9.33-5"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8 8 0 1 1 11.2 3a6 6 0 0 0 9.8 9.8z"/></svg>';

// ============= Tema =============
function applyTheme(t){
  t==='light'?document.documentElement.setAttribute('data-theme','light'):document.documentElement.removeAttribute('data-theme');
  const b=$('#themebtn');if(b)b.innerHTML=t==='light'?MOON:SUN;
}
(function(){
  let t='dark';try{t=localStorage.getItem('theme')||'dark';}catch(e){}
  applyTheme(t);
  const b=$('#themebtn');
  if(b)b.addEventListener('click',()=>{t=t==='light'?'dark':'light';try{localStorage.setItem('theme',t);}catch(e){}applyTheme(t);});
})();

// ============= Notificaciones =============
function updateNotifBtn(){
  const b=$('#notifbtn');if(!b)return;
  const on=typeof Notification!=='undefined'&&Notification.permission==='granted';
  b.innerHTML=on?BELL_ON:BELL_OFF;b.classList.toggle('active',on);
  b.title=on?'Alertas activas — click para info':'Activar alertas de precio';
}
updateNotifBtn();
$('#notifbtn').addEventListener('click',async()=>{
  if(typeof Notification==='undefined')return;
  if(Notification.permission==='denied'){alert('Las notificaciones están bloqueadas. Actívalas en la configuración del navegador.');return;}
  const p=await Notification.requestPermission();
  if(p==='granted')new Notification('✅ Alertas activadas',{body:'Te avisaremos cuando bajen precios en tu watchlist.',icon:'./icon-192.png'});
  updateNotifBtn();
});

// ============= Watchlist (#1) =============
function loadWL(){
  try{WATCHLIST=new Set(JSON.parse(localStorage.getItem('xbox-wl')||'[]'));}catch(e){WATCHLIST=new Set();}
  try{PRICE_SNAP=JSON.parse(localStorage.getItem('xbox-snap')||'{}');}catch(e){PRICE_SNAP={};}
}
function saveWL(){try{localStorage.setItem('xbox-wl',JSON.stringify([...WATCHLIST]));}catch(e){}}
function saveSnap(){
  const s={};
  for(const g of GAMES){if(WATCHLIST.has(g.id)&&g._best)s[g.id]=g._best.clp;}
  try{localStorage.setItem('xbox-snap',JSON.stringify(s));}catch(e){}
}
function toggleWL(id){
  WATCHLIST.has(id)?WATCHLIST.delete(id):WATCHLIST.add(id);
  saveWL();updateWLBadge();
  document.querySelectorAll(`.card[data-id="${id}"]`).forEach(c=>{
    c.classList.toggle('starred',WATCHLIST.has(id));
    const b=c.querySelector('.star-btn');
    if(b){b.classList.toggle('star-on',WATCHLIST.has(id));b.innerHTML=STAR_ICO+'<span>'+(WATCHLIST.has(id)?'Guardado':'Guardar')+'</span>';}
  });
}
function updateWLBadge(){
  const b=$('#wl-badge');if(!b)return;
  b.textContent=WATCHLIST.size;b.style.display=WATCHLIST.size?'':'none';
}
function checkAlerts(){
  if(!WATCHLIST.size)return;
  const drops=[];
  for(const g of GAMES){
    if(!WATCHLIST.has(g.id)||!g._best)continue;
    const prev=PRICE_SNAP[g.id];
    if(prev&&g._best.clp<prev*0.98){
      drops.push({t:g.t,pct:Math.round((1-g._best.clp/prev)*100)});
    }
  }
  saveSnap();
  if(!drops.length)return;
  const txt=$('#alert-text');
  if(txt)txt.innerHTML=drops.length===1
    ?`<b>${drops[0].t}</b> bajó ${drops[0].pct}% de precio en tu watchlist`
    :`<b>${drops.length} juegos</b> bajaron de precio en tu watchlist`;
  $('#alert-banner').classList.add('show');
  if(typeof Notification!=='undefined'&&Notification.permission==='granted'){
    new Notification('📉 Baja de precio — Xbox Deals',{
      body:drops.length===1?`${drops[0].t} bajó ${drops[0].pct}%`:`${drops.length} juegos en tu watchlist bajaron de precio`,
      icon:'./icon-192.png'
    });
  }
}

// ============= URL persistente (#9) =============
function pushURL(){
  const p=new URLSearchParams();
  const qv=$('#q')?.value.trim();const sv=$('#sort')?.value;const rv=$('#rated')?.checked;const gv=$('#genre')?.value;
  if(qv)p.set('q',qv);if(sv&&sv!=='new')p.set('sort',sv);if(mode!=='all')p.set('mode',mode);
  if(rv)p.set('rated','1');if(gv)p.set('genre',gv);
  history.replaceState({},'','?'+(p.toString()));
}
function loadURL(){
  const p=new URLSearchParams(location.search);
  mode=p.get('mode')||'all';
  if($('#q'))$('#q').value=p.get('q')||'';
  if($('#sort'))$('#sort').value=p.get('sort')||'new';
  if($('#rated'))$('#rated').checked=p.get('rated')==='1';
  if($('#genre')&&p.get('genre'))$('#genre').value=p.get('genre')||'';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===mode));
}
window.addEventListener('popstate',()=>{if(GAMES.length){loadURL();render();}});

// ============= Hash routing — vista detalle (#3) =============
function checkHash(){
  if(!location.hash.startsWith('#game/'))return false;
  const id=location.hash.slice(6);
  const g=GAMES.find(x=>x.id===id);
  if(g){showDetail(g);return true;}
  return false;
}
function showDetail(g){
  $('#main-view').classList.add('hide');
  $('#detail-view').classList.add('show');
  document.title=g.t+' — Precios Xbox por región';
  renderDetail(g);window.scrollTo({top:0,behavior:'instant'});
}
function showMain(){
  $('#detail-view').classList.remove('show');
  $('#main-view').classList.remove('hide');
  document.title='Comparador de precios Xbox — Chile y 12 regiones';
}
(()=>{
  const b=$('#detail-back');
  b.innerHTML=BACK+' Volver al catálogo';
  b.addEventListener('click',()=>{history.replaceState({},'',location.pathname+location.search);showMain();});
})();
window.addEventListener('hashchange',()=>{if(GAMES.length)checkHash();});

// ============= Boot =============
async function boot(){
  loadWL();updateWLBadge();
  try{
    const safeJson=r=>(r&&r.ok)?r.json():null;
    const [g,m,h]=await Promise.all([
      fetch('./data/games.json').then(r=>r.json()),
      fetch('./data/meta.json').then(r=>r.json()),
      fetch('./data/history.json').then(safeJson).catch(()=>null)
    ]);
    GAMES=g;META=m;REGIONS=m.regions;REGIONS.forEach(r=>REG[r.code]=r);HISTORY=h||{};
  }catch(e){
    console.error('Boot error:',e);
    $('#state').innerHTML='<div>No pude cargar los datos todavía. Si recién desplegaste, espera a que el robot corra por primera vez.</div>';
    return;
  }

  const refCode=(REGIONS.find(r=>r.ref)||REGIONS[0]).code;
  for(const g of GAMES){
    const list=[];let best=null,bestOffer=null;
    for(const R of REGIONS){
      const p=g.r[R.code];if(!p)continue;
      const it={code:R.code,local:p[0],clp:p[1],disc:p[2],end:p[3]||null};
      list.push(it);
      if(!best||it.clp<best.clp)best=it;
      if(it.disc>0&&(!bestOffer||it.clp<bestOffer.clp))bestOffer=it;
    }
    list.sort((a,b)=>a.clp-b.clp);
    g._list=list;g._best=best;g._bestOffer=bestOffer;
    g._cl=g.r[refCode]?g.r[refCode][1]:null;
    g._disc=list.reduce((mx,x)=>Math.max(mx,x.disc||0),0);
    g._rel=g.d||(g.y?(g.y+'-01-01'):'0000-00-00');
  }

  $('#state').hidden=true;$('#controls').hidden=false;$('#tabs').hidden=false;
  $('#stat').innerHTML='Actualizado '+(META.updated?new Date(META.updated).toLocaleDateString('es-CL'):'-')+'<br><b>'+META.count.toLocaleString('es-CL')+'</b> juegos · <b>'+META.withRating.toLocaleString('es-CL')+'</b> con nota';
  $('#foot').innerHTML='<b>Datos:</b> tienda oficial de Xbox de cada región, convertidos a CLP con el tipo de cambio del día. Notas de IGDB.';

  // Género dropdown
  const genres=new Set();
  for(const g of GAMES){if(Array.isArray(g.g))g.g.forEach(x=>genres.add(x));}
  if(genres.size){
    const sel=$('#genre');
    [...genres].sort().forEach(name=>{const o=document.createElement('option');o.value=name;o.textContent=name;sel.appendChild(o);});
  }

  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');mode=t.dataset.mode;
    if(mode==='ofertas')$('#sort').value='disc';
    pushURL();render();
  }));
  ['#q','#sort','#rated','#genre'].forEach(s=>$(s)?.addEventListener('input',()=>{pushURL();render();}));

  loadURL();
  checkAlerts();
  if(!checkHash())render();
}

// ============= Render lista =============
function render(){
  const q=$('#q').value.trim().toLowerCase();
  const sort=$('#sort').value;const rated=$('#rated').checked;const genre=$('#genre')?.value||'';
  const bestOf=g=>g._best;
  const saveOf=g=>{const b=bestOf(g);return(g._cl&&b&&b.clp<g._cl)?(1-b.clp/g._cl):-1;};
  ROWS=GAMES.filter(g=>{
    if(mode==='ofertas'&&!(g._disc>0))return false;
    if(mode==='watchlist'&&!WATCHLIST.has(g.id))return false;
    if(rated&&g.mc==null)return false;
    if(genre&&!(Array.isArray(g.g)&&g.g.includes(genre)))return false;
    if(q&&!g.t.toLowerCase().includes(q))return false;
    return true;
  });
  ROWS.sort((a,b)=>{switch(sort){
    case 'mc':return(b.mc??-1)-(a.mc??-1);
    case 'clp':{const av=(bestOf(a)||{}).clp??Infinity,bv=(bestOf(b)||{}).clp??Infinity;return av-bv;}
    case 'save':return saveOf(b)-saveOf(a);
    case 'disc':return b._disc-a._disc;
    case 'name':return a.t.localeCompare(b.t);
    case 'new':return a._rel<b._rel?1:a._rel>b._rel?-1:0;
  }});
  $('#count').textContent=ROWS.length.toLocaleString('es-CL')+' juegos';
  page=1;draw();
}
function draw(){
  const grid=$('#grid');grid.innerHTML='';
  const start=(page-1)*PER,end=Math.min(start+PER,ROWS.length);
  for(let i=start;i<end;i++)grid.appendChild(card(ROWS[i]));
  buildPager();
}
function goPage(p){
  const total=Math.max(1,Math.ceil(ROWS.length/PER));
  page=Math.min(Math.max(1,p),total);draw();window.scrollTo({top:0,behavior:'smooth'});
}
function buildPager(){
  const total=Math.max(1,Math.ceil(ROWS.length/PER));
  const el=$('#pager');el.innerHTML='';
  if(total<=1)return;
  const mk=(label,p,active,disabled)=>{const b=document.createElement('button');b.className='pbtn'+(active?' active':'');
    b.textContent=label;if(disabled)b.disabled=true;else if(!active)b.addEventListener('click',()=>goPage(p));el.appendChild(b);};
  const gap=()=>{const s=document.createElement('span');s.className='pgap';s.textContent='…';el.appendChild(s);};
  mk('‹',page-1,false,page===1);
  const set=new Set([1,2,total-1,total,page-1,page,page+1]);
  const arr=[...set].filter(p=>p>=1&&p<=total).sort((a,b)=>a-b);
  let prev=0;
  for(const p of arr){if(p-prev>1)gap();mk(String(p),p,p===page,false);prev=p;}
  mk('›',page+1,false,page===total);
  const info=document.createElement('span');info.className='pinfo';info.textContent='Página '+page+' de '+total.toLocaleString('es-CL');el.appendChild(info);
}

// ============= Card =============
function card(g){
  let best=g._best;
  if(mode==='ofertas'&&g._bestOffer)best=g._bestOffer;
  const save=(g._cl&&best&&best.clp<g._cl)?Math.round((1-best.clp/g._cl)*100):null;
  const el=document.createElement('div');
  el.className='card'+(WATCHLIST.has(g.id)?' starred':'');el.dataset.id=g.id;
  const scoreEl=g.mc!=null
    ?`<span class="score" style="background:${scoreColor(g.mc)}">${g.mc}</span><span class="slabel">IGDB</span>`
    :`<span class="score na">N/A</span>`;
  const genreTags=(Array.isArray(g.g)&&g.g.length)?`<div class="genre-tags">${g.g.slice(0,3).map(x=>`<span class="gtag">${x}</span>`).join('')}</div>`:'';
  let pbox;
  if(best){
    const endTxt=(best.disc&&best.end)?`<div class="ends">${CLOCK}Termina ${fmtDate(best.end)}</div>`:'';
    pbox=`<div class="pbox">
      <div class="chile">Chile <b>${fmtCLP(g._cl)}</b></div>
      <div class="bestrow">${flagImg(best.code)}<span class="bregion">${REG[best.code].name||best.code}</span><span class="bprice">${fmtCLP(best.clp)}</span>${best.disc?`<span class="tag">-${best.disc}%</span>`:(save!=null?`<span class="tag">-${save}%</span>`:'')}</div>
      <div class="sub2">${fmtLocal(best.local,REG[best.code].cur)}${save!=null?` · ahorras ${save}%`:''}</div>
      ${endTxt}</div>`;
  }else pbox=`<div class="pbox"><div class="na2">Sin precio</div></div>`;
  const regHTML=g._list.map(it=>`<div class="rrow">${flagImg(it.code)}<span class="rname">${REG[it.code].name||it.code}${(it.disc&&it.end)?`<span class="rend"> · oferta hasta ${fmtDate(it.end)}</span>`:''}</span><span class="rlocal">${fmtLocal(it.local,REG[it.code].cur)}</span><span class="rclp">${fmtCLP(it.clp)}</span>${it.disc?`<span class="rdisc">-${it.disc}%</span>`:''}<a href="https://www.microsoft.com/store/productId/${g.id}?market=${it.code}" target="_blank" rel="noopener">Ver</a></div>`).join('');
  const starred=WATCHLIST.has(g.id);
  el.innerHTML=`${g.img?`<img class="cover" src="${g.img}" alt="" loading="lazy">`:`<div class="cover ph">?</div>`}
  <div class="info"><div class="gtitle">${g.t}</div><div class="gmeta">${scoreEl}${isPreorder(g)?`<span class="preorder-badge"><span class="dot"></span>Preventa · ${fmtRelDate(g.d)}</span>`:`<span class="year">${g.y||''}</span>`}</div>${genreTags}</div>
  ${pbox}
  <div class="actions">
    <button class="expand">Ver todas las regiones (${g._list.length}) ${CHEV}</button>
    <div class="act-group">
      <button class="act-btn star-btn${starred?' star-on':''}">${STAR_ICO}<span>${starred?'Guardado':'Guardar'}</span></button>
      <button class="act-btn cmp-btn">${COMPARE_ICO}<span>Comparar</span></button>
      ${g.img?`<button class="act-btn dl-btn">${DLOAD}<span>Portada</span></button>`:''}
      <button class="act-btn detail-btn">${DETAIL_ICO}<span>Detalle</span></button>
    </div>
  </div>
  <div class="regions">${regHTML}</div>`;

  const xbtn=el.querySelector('.expand'),xbx=el.querySelector('.regions');
  xbtn.addEventListener('click',()=>{const o=xbx.classList.toggle('open');xbtn.classList.toggle('open',o);});
  el.querySelector('.star-btn').addEventListener('click',()=>toggleWL(g.id));
  el.querySelector('.cmp-btn').addEventListener('click',()=>openCmp(g));
  el.querySelector('.detail-btn').addEventListener('click',()=>{
    history.pushState({},'',location.pathname+location.search+'#game/'+g.id);
    showDetail(g);
  });
  const dl=el.querySelector('.dl-btn');
  if(dl)dl.addEventListener('click',async e=>{
    e.preventDefault();if(dl.disabled)return;dl.disabled=true;
    const orig=dl.innerHTML;
    dl.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width:13px;height:13px;animation:spin 1s linear infinite;flex:none"><circle cx="12" cy="12" r="9" stroke-dasharray="50" stroke-dashoffset="15"/></svg><span>Descargando…</span>`;
    const url=g.img+'?w=3840&h=3840&format=jpg&q=100';
    try{
      const r=await fetch(url);if(!r.ok)throw 0;
      const blob=await r.blob();const ou=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=ou;
      a.download=g.t.replace(/[^a-z0-9\-_()\[\] ]/gi,'_').trim()+'.jpg';
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(ou),10000);
    }catch(err){window.open(url,'_blank','noopener');}
    finally{dl.innerHTML=orig;dl.disabled=false;}
  });
  return el;
}

// ============= Comparador modal (#6) =============
function openCmp(g){
  cmpGame=g;cmpAsc=true;
  const mc=$('#modal-cover');mc.src=g.img||'';mc.style.display=g.img?'':'none';
  $('#modal-title').textContent=g.t;
  renderCmpBody();
  $('#modal-overlay').classList.add('open');document.body.style.overflow='hidden';
}
function renderCmpBody(){
  const list=[...cmpGame._list].sort((a,b)=>cmpAsc?a.clp-b.clp:b.clp-a.clp);
  const minClp=Math.min(...list.map(x=>x.clp));
  const tbody=$('#cmp-body');tbody.innerHTML='';
  for(const it of list){
    const r=REG[it.code];const isBest=it.clp===minClp;
    const tr=document.createElement('tr');if(isBest)tr.className='best-row';
    tr.innerHTML=`<td>${flagImg(it.code)} <b>${r.name||it.code}</b>${isBest?`<span class="best-badge">Más barato</span>`:''}</td>
      <td><span class="cmp-access">${r.access||''}</span></td>
      <td style="color:var(--muted);font-variant-numeric:tabular-nums">${fmtLocal(it.local,r.cur)}</td>
      <td><b style="font-variant-numeric:tabular-nums">${fmtCLP(it.clp)}</b></td>
      <td>${it.disc?`<span class="rdisc">-${it.disc}%</span>`:'-'}</td>
      <td style="color:var(--muted);font-size:12px">${it.end?fmtDate(it.end):'-'}</td>
      <td><a class="cmp-link" href="https://www.microsoft.com/store/productId/${cmpGame.id}?market=${it.code}" target="_blank" rel="noopener">Ver →</a></td>`;
    tbody.appendChild(tr);
  }
}
$('#cmp-sort-clp').addEventListener('click',()=>{cmpAsc=!cmpAsc;$('#cmp-sort-clp').textContent='CLP '+(cmpAsc?'↑':'↓');renderCmpBody();});
$('#modal-close').addEventListener('click',closeCmp);
$('#modal-overlay').addEventListener('click',e=>{if(e.target===$('#modal-overlay'))closeCmp();});
function closeCmp(){$('#modal-overlay').classList.remove('open');document.body.style.overflow='';}

// ============= Vista detalle (#3) =============
function renderDetail(g){
  const hist=HISTORY[g.id]||{};
  const hasHist=Object.keys(hist).length>0;
  const best=g._best;
  const save=(g._cl&&best&&best.clp<g._cl)?Math.round((1-best.clp/g._cl)*100):null;
  const scoreEl=g.mc!=null
    ?`<span class="score" style="background:${scoreColor(g.mc)}">${g.mc}</span><span class="slabel">IGDB</span>`
    :`<span class="score na">N/A</span>`;
  const genreTags=(Array.isArray(g.g)&&g.g.length)?g.g.map(x=>`<span class="detail-gtag">${x}</span>`).join(''):'';
  const coverEl=g.img?`<img class="detail-cover" src="${g.img}?w=600&h=600&format=jpg&q=90" alt="${g.t}">`:`<div class="detail-cover-ph">?</div>`;
  const regHTML=g._list.map(it=>{
    const r=REG[it.code];const isBest=best&&it.clp===best.clp;
    return `<div class="rrow"${isBest?' style="background:color-mix(in srgb,var(--accent) 7%,transparent)"':''}>
      ${flagImg(it.code)}<span class="rname">${r.name||it.code}${isBest?`<span class="best-badge">Más barato</span>`:''}
      ${(it.disc&&it.end)?`<span class="rend"> · hasta ${fmtDate(it.end)}</span>`:''}</span>
      <span class="cmp-access">${r.access||''}</span>
      <span class="rlocal">${fmtLocal(it.local,r.cur)}</span>
      <span class="rclp">${fmtCLP(it.clp)}</span>
      ${it.disc?`<span class="rdisc">-${it.disc}%</span>`:''}
      <a href="https://www.microsoft.com/store/productId/${g.id}?market=${it.code}" target="_blank" rel="noopener" class="cmp-link">Ver →</a>
    </div>`;
  }).join('');
  const chartRegOpts=Object.keys(hist).map(code=>{
    const r=REG[code]||{name:code};return `<option value="${code}"${code==='CL'?' selected':''}>${r.name||code}</option>`;
  }).join('');
  const defReg=hist['CL']?'CL':(Object.keys(hist)[0]||'');
  chartRegion=defReg;chartPeriod=90;

  $('#detail-content').innerHTML=`
  <div class="detail-hero">
    ${coverEl}
    <div>
      <h1 class="detail-title">${g.t}</h1>
      <div class="detail-score-row">${scoreEl}${isPreorder(g)?`<span class="preorder-badge" style="font-size:12px;padding:3px 9px"><span class="dot"></span>Preventa · Lanzamiento el ${fmtRelDate(g.d)}</span>`:`<span class="year">${g.y||''}</span>`}</div>
      ${genreTags?`<div class="detail-genre-tags">${genreTags}</div>`:''}
      ${best?`<div class="detail-best">Más barato en <b>${REG[best.code]?.name||best.code}</b> — <span class="bprice">${fmtCLP(best.clp)}</span>${save?` <span class="tag">-${save}% vs Chile</span>`:''}</div>`:''}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
        <button class="act-btn star-btn-d${WATCHLIST.has(g.id)?' star-on':''}">${STAR_ICO}<span>${WATCHLIST.has(g.id)?'Guardado':'Guardar en watchlist'}</span></button>
        ${g.img?`<button class="act-btn dl-btn-d">${DLOAD}<span>Portada 4K</span></button>`:''}
      </div>
    </div>
  </div>
  <div class="detail-section">
    <p class="detail-section-title">Historial de precios</p>
    ${hasHist?`<div class="chart-wrap">
      <div class="chart-controls">
        <select class="chart-rgsel" id="chart-rgsel">${chartRegOpts}</select>
        <div class="chart-period">
          <button class="cper" data-d="30">30d</button>
          <button class="cper active" data-d="90">90d</button>
          <button class="cper" data-d="0">Todo</button>
        </div>
      </div>
      <div id="chart-container"></div>
    </div>`:`<div class="chart-empty">📊 El historial estará disponible pronto. Vuelve después de la próxima actualización.</div>`}
  </div>
  <div class="detail-section">
    <p class="detail-section-title">Precios por región</p>
    <div style="border:1px solid var(--border);border-radius:11px;overflow:hidden">${regHTML}</div>
  </div>`;

  // Eventos detalle
  const sd=$('#detail-content').querySelector('.star-btn-d');
  if(sd)sd.addEventListener('click',()=>{toggleWL(g.id);sd.classList.toggle('star-on',WATCHLIST.has(g.id));sd.innerHTML=STAR_ICO+'<span>'+(WATCHLIST.has(g.id)?'Guardado':'Guardar en watchlist')+'</span>';});
  const dd=$('#detail-content').querySelector('.dl-btn-d');
  if(dd)dd.addEventListener('click',async e=>{
    e.preventDefault();if(dd.disabled)return;dd.disabled=true;const orig=dd.innerHTML;
    dd.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width:13px;height:13px;animation:spin 1s linear infinite;flex:none"><circle cx="12" cy="12" r="9" stroke-dasharray="50" stroke-dashoffset="15"/></svg><span>Descargando…</span>`;
    const url=g.img+'?w=3840&h=3840&format=jpg&q=100';
    try{const r=await fetch(url);if(!r.ok)throw 0;const b=await r.blob();const ou=URL.createObjectURL(b);const a=document.createElement('a');a.href=ou;a.download=g.t.replace(/[^a-z0-9\-_()\[\] ]/gi,'_').trim()+'.jpg';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(ou),10000);}
    catch(err){window.open(url,'_blank','noopener');}
    finally{dd.innerHTML=orig;dd.disabled=false;}
  });
  if(hasHist){
    renderChart(g.id);
    const rs=$('#chart-rgsel');
    if(rs)rs.addEventListener('change',()=>{chartRegion=rs.value;renderChart(g.id);});
    $('#detail-content').querySelectorAll('.cper').forEach(b=>{
      b.addEventListener('click',()=>{
        $('#detail-content').querySelectorAll('.cper').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');chartPeriod=Number(b.dataset.d);renderChart(g.id);
      });
    });
  }
}

// ============= Gráfico SVG =============
function renderChart(gameId){
  const c=$('#chart-container');if(!c)return;
  const hist=(HISTORY[gameId]||{})[chartRegion]||[];
  const now=Date.now();const cut=chartPeriod>0?now-chartPeriod*864e5:0;
  const pts=hist.filter(([d])=>new Date(d).getTime()>=cut);
  if(pts.length<2){c.innerHTML=`<div class="chart-empty">Pocos datos en este período — prueba "Todo".</div>`;return;}
  const prices=pts.map(([,p])=>p);
  const minP=Math.min(...prices),maxP=Math.max(...prices),rng=maxP-minP||1;
  const W=560,H=140,PL=4,PR=4,PT=12,PB=22,iW=W-PL-PR,iH=H-PT-PB;
  const xs=pts.map((_,i)=>PL+i/(pts.length-1)*iW);
  const ys=pts.map(([,p])=>PT+iH-(p-minP)/rng*iH);
  const line=xs.map((x,i)=>`${x},${ys[i]}`).join(' ');
  const area=`${xs[0]},${PT+iH} `+xs.map((x,i)=>`${x},${ys[i]}`).join(' ')+` ${xs[xs.length-1]},${PT+iH}`;
  const fmtD=d=>{const p=d.split('-');return p[2]+'/'+p[1];};
  const yLabs=[0,.5,1].map(f=>{const v=minP+f*rng;const y=PT+iH-f*iH;
    return `<text x="${W-PR}" y="${y+4}" text-anchor="end" fill="var(--faint)" font-size="10" font-family="monospace">${fmtCLP(v)}</text>`;}).join('');
  const xLabs=`<text x="${PL}" y="${H-2}" fill="var(--faint)" font-size="10">${fmtD(pts[0][0])}</text>
    <text x="${W-PR}" y="${H-2}" text-anchor="end" fill="var(--faint)" font-size="10">${fmtD(pts[pts.length-1][0])}</text>`;
  const dots=xs.map((x,i)=>`<circle cx="${x}" cy="${ys[i]}" r="4" fill="var(--accent)" stroke="var(--bg)" stroke-width="2" opacity="0" style="cursor:pointer">
    <title>${fmtD(pts[i][0])}: ${fmtCLP(pts[i][1])}${pts[i][2]?` (−${pts[i][2]}%)`:''}</title></circle>`).join('');
  c.innerHTML=`<svg class="price-chart" viewBox="0 0 ${W} ${H}" style="height:${H}px">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity=".15"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    <polygon points="${area}" fill="url(#ag)"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${yLabs}${xLabs}${dots}
  </svg>`;
  c.querySelectorAll('circle').forEach(ci=>{
    ci.addEventListener('mouseenter',()=>ci.setAttribute('opacity','1'));
    ci.addEventListener('mouseleave',()=>ci.setAttribute('opacity','0'));
  });
}

// ============= PWA (#7) =============
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

boot();
